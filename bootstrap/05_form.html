<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 表單範例</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

        <div class="text-center mb-4">
            <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 表單範例</p>
            <h1 class="display-6 fw-bold">表單設計與互動</h1>
            <p class="lead text-muted">把輸入框、選單與按鈕整理成一個更易閱讀的卡片樣式。</p>
        </div>

        <div class="card shadow-sm border-0 p-4 mx-auto" style="max-width: 760px;">
            <form action="/action_page.php">
                <div class="form-check form-switch text-start">
                    <input class="form-check-input" type="checkbox" id="mySwitch" name="darkmode" value="yes" checked>
                    <label class="form-check-label" for="mySwitch">切換主題</label>
                </div>
                <div class="mt-4">
                    <label for="customRange" class="form-label">選取範圍</label>
                    <input type="range" class="form-range" id="customRange" step="25" min="0" max="100">
                </div>
                <div class="mb-3 mt-3 text-start">
                    <label for="email" class="form-label">帳號：</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
                </div>
                <div class="mb-3 text-start">
                    <label for="pwd" class="form-label">密碼：</label>
                    <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
                </div>
                <div class="form-check mt-4 text-start">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="remember">記住密碼
                    </label>
                </div>
                <div class="mt-4 text-start">
                    <label for="gender">性別：</label>
                    <select class="form-select mt-3" id="gender">
                        <option>男</option>
                        <option>女</option>
                    </select>
                </div>
                <div class="mb-3 mt-5 text-start">
                    <label for="comment">關於我的：</label>
                    <textarea class="form-control mt-3" rows="6" id="comment" name="text"></textarea>
                </div>
                <button type="reset" class="btn btn-outline-primary">重置</button>
                <button type="submit" class="btn btn-primary">提交</button>
            </form>
        </div>
    </div>
</body>
</html>
