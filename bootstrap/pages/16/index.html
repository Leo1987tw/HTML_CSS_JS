<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 後臺管理頁面範例</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <a href="../../16_modal.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

        <div class="text-center mb-4">
            <p class="text-uppercase text-primary fw-bold mb-2">後臺管理範例</p>
            <h1 class="display-6 fw-bold">學生資料管理</h1>
            <p class="lead text-muted">這是一個整合表格與操作按鈕的後臺管理範例頁面。</p>
        </div>

        <div class="text-end mb-3">
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#save">
                ＋ 新增學生
            </button>

            <div class="modal fade" id="save" tabindex="-1" aria-labelledby="saveLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title" id="saveLabel">新增學生</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p class="mb-2">新增學生</p>
                            <p class="mb-0 text-muted">請填入學生基本資訊，完成新增流程。</p>
                        </div>
                        <form action="./store.html">
                            <div class="card shadow-sm border-0 p-4 mx-auto" style="max-width: 720px;">

                                <div class="mb-3">
                                    <label class="form-label">學生 ID</label>
                                    <input type="text" class="form-control" name="id" placeholder="input id">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">學生姓名</label>
                                    <input type="text" class="form-control" name="name" placeholder="input name">
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary"
                                    data-bs-dismiss="modal">取消</button>
                                <button type="submit" class="btn btn-success">儲存新增</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="text-center">id</th>
                        <th class="text-center">name</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="text-center">1</td>
                        <td class="text-center">amy</td>
                        <td class="text-center">
                            <button type="button" class="btn btn-warning text-dark" data-bs-toggle="modal"
                                data-bs-target="#edit">
                                修改
                            </button>
                            <div class="modal fade" id="edit" tabindex="-1" aria-labelledby="editLabel"
                                aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-header bg-warning text-dark">
                                            <h5 class="modal-title" id="editLabel">編輯學生</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <p class="mb-2">更新資料內容</p>
                                            <p class="mb-0 text-muted">請修改學生名稱後完成更新。</p>
                                        </div>
                                        <form action="./update.html">
                                        <div class="card shadow-sm border-0 p-4 mx-auto" style="max-width: 720px;">
                                            <input type="hidden" name="id" value="1">
                                            <div class="mb-3">
                                                <label class="form-label">學生姓名</label>
                                                <input type="text" class="form-control" name="name"
                                                    placeholder="input name">
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-outline-secondary"
                                                data-bs-dismiss="modal">取消</button>
                                            <button type="submit" class="btn btn-warning text-dark">確認修改</button>
                                        </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-danger" data-bs-toggle="modal"
                                data-bs-target="#delete">
                                刪除
                            </button>
                            <div class="modal fade" id="delete" tabindex="-1" aria-labelledby="deleteLabel"
                                aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-header bg-danger text-white">
                                            <h5 class="modal-title" id="deleteLabel">刪除資料</h5>
                                            <button type="button" class="btn-close btn-close-white"
                                                data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <form action="./delete.html" class="d-flex justify-content-center gap-2 mt-4">
                                            <div class="modal-body">
                                                <p class="mb-2">你即將刪除這筆資料，這個動作可能無法復原。</p>
                                                <p class="mb-0 text-muted">請再次確認是否要執行刪除。</p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-outline-secondary"
                                                    data-bs-dismiss="modal">取消</button>
                                                <button type="submit" class="btn btn-danger">確認刪除</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>






<div class="card shadow-sm border-0 p-4 p-md-5">
    <h2 class="h4 mb-3">刪除資料</h2>
    <p class="text-muted">刪除操作通常使用警示樣式，讓使用者在確認後再執行不可逆的動作。</p>



</div>
