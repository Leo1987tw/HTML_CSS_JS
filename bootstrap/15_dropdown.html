<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <title>Bootstrap 下拉式選單範例</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

        <div class="text-center mb-5">
            <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 下拉式選單範例</p>
            <h1 class="display-5 fw-bold">下拉式選單與導覽</h1>
            <p class="lead text-muted">下拉式選單常用於網站導覽、操作選項與內容分類。這裡示範基本按鈕式下拉選單，以及不同外觀的選單樣式。</p>
        </div>

        <div class="card shadow-sm border-0 p-4 p-md-5">
            <h2 class="h4 mb-3">基本下拉式選單</h2>
            <p class="text-muted">使用 <code>.dropdown</code>、<code>.dropdown-toggle</code> 和 <code>.dropdown-menu</code>，就可以快速建立可展開的選單。</p>
            <div class="dropdown">
                <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                    選單按鈕
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">項目 1</a></li>
                    <li><a class="dropdown-item" href="#">項目 2</a></li>
                    <li><a class="dropdown-item" href="#">項目 3</a></li>
                </ul>
            </div>

            <h2 class="h4 mt-4 mb-3">不同樣式的下拉選單</h2>
            <div class="d-flex flex-wrap gap-2">
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Outline
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">設定</a></li>
                        <li><a class="dropdown-item" href="#">帳號</a></li>
                    </ul>
                </div>

                <div class="dropdown">
                    <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Success
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">新增</a></li>
                        <li><a class="dropdown-item" href="#">儲存</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
