<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <title>Bootstrap 互動視窗範例</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

        <div class="text-center mb-5">
            <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 互動視窗範例</p>
            <h1 class="display-5 fw-bold">互動視窗與彈跳提示</h1>
            <p class="lead text-muted">Bootstrap 的互動視窗可用來顯示額外內容、表單或確認操作，適合用於登入、通知與詳細資料展示。</p>
            <a href="./pages/16/index.html" class="btn btn-outline-primary btn-sm mt-2">後臺管理範例</a>
        </div>

        <div class="card shadow-sm border-0 p-4 p-md-5">
            <h2 class="h4 mb-3">開啟互動視窗</h2>
            <p class="text-muted">點擊下方按鈕即可開啟一個簡單的 Bootstrap Modal，內容可包含標題、描述與操作按鈕。</p>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                開啟互動視窗
            </button>

            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">歡迎使用互動視窗</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>這是一個簡單的 Bootstrap Modal 範例。</p>
                            <p>你可以在這裡放入產品說明、表單內容或確認訊息。</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
                            <button type="button" class="btn btn-primary">確認</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
