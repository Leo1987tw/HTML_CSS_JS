<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <title>Bootstrap 進度條範例</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
  <div class="container py-5">
    <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

    <div class="text-center mb-5">
      <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 進度條範例</p>
      <h1 class="display-5 fw-bold">進度條與完成度展示</h1>
      <p class="lead text-muted">Bootstrap 的進度條可用來表示任務完成度、上傳進度或系統狀態。這裡示範基本的 50%、70% 與 100% 進度條樣式。</p>
    </div>

    <div class="card shadow-sm border-0 p-4 p-md-5">
      <h2 class="h4 mb-3">基本進度條</h2>
      <p class="text-muted">使用 <code>.progress</code> 與 <code>.progress-bar</code> 即可建立簡單且清楚的進度顯示。</p>
      <div class="progress mb-3">
        <div class="progress-bar" style="width: 50%;">50%</div>
      </div>

      <h2 class="h4 mt-4 mb-3">不同進度內容</h2>
      <p class="text-muted">透過調整寬度與文字內容，就能把進度條套用到不同情境，例如流程進度與完成度。</p>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="progress">
            <div class="progress-bar" style="width: 70%;">70%</div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="progress">
            <div class="progress-bar" style="width: 100%;">100%</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
