<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <title>Bootstrap 按鈕範例</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

        <div class="text-center mb-5">
            <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 按鈕範例</p>
            <h1 class="display-5 fw-bold">按鈕樣式與不同寬度展示</h1>
            <p class="lead text-muted">這裡示範 Bootstrap 按鈕的基本樣式、不同顏色、以及 full-width 與 grid 佈局的使用方式。</p>
        </div>

        <div class="card shadow-sm border-0 p-4 p-md-5 mx-auto" style="max-width: 760px;">
            <h2 class="h4 mb-3">基本按鈕</h2>
            <div class="d-flex flex-wrap gap-2 mb-4">
                <button type="button" class="btn btn-primary">Primary</button>
                <button type="button" class="btn btn-secondary">Secondary</button>
                <button type="button" class="btn btn-success">Success</button>
                <button type="button" class="btn btn-danger">Danger</button>
                <button type="button" class="btn btn-warning">Warning</button>
                <button type="button" class="btn btn-info">Info</button>
                <button type="button" class="btn btn-dark">Dark</button>
                <button type="button" class="btn btn-light">Light</button>
            </div>

            <h2 class="h4 mb-3">外框按鈕</h2>
            <div class="d-flex flex-wrap gap-2 mb-4">
                <button type="button" class="btn btn-outline-primary">Outline Primary</button>
                <button type="button" class="btn btn-outline-secondary">Outline Secondary</button>
                <button type="button" class="btn btn-outline-success">Outline Success</button>
            </div>

            <h2 class="h4 mb-3">不同寬度</h2>
            <button type="button" class="btn btn-primary w-100 mb-3">Full Width Button</button>
            <div class="d-grid gap-2 mb-3">
                <button class="btn btn-primary" type="button">Grid Button 1</button>
                <button class="btn btn-primary" type="button">Grid Button 2</button>
            </div>
            <div class="d-grid gap-2 col-6 mx-auto mb-3">
                <button class="btn btn-primary" type="button">Half Width</button>
                <button class="btn btn-primary" type="button">Half Width</button>
            </div>
            <div class="d-grid gap-2 col-4 mx-auto">
                <button class="btn btn-primary" type="button">Small Grid</button>
                <button class="btn btn-primary" type="button">Small Grid</button>
            </div>

            <h2 class="h4 mt-4 mb-3">按鈕元素</h2>
            <div class="d-flex flex-wrap gap-2">
                <a href="#" class="btn btn-success">Link Button</a>
                <button type="button" class="btn btn-success">Button</button>
                <input type="button" class="btn btn-success" value="Input Button">
                <input type="submit" class="btn btn-success" value="Submit Button">
                <input type="reset" class="btn btn-success" value="Reset Button">
            </div>
        </div>
    </div>
</body>

</html>
