<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <title>Bootstrap 圖片範例</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

        <div class="text-center mb-5">
            <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 圖片範例</p>
            <h1 class="display-5 fw-bold">圖片圓角與邊框效果</h1>
            <p class="lead text-muted">這裡示範 Bootstrap 常見的圖片樣式，包括圓角、圓形與縮圖邊框效果。</p>
        </div>

        <div class="row g-4">
            <div class="col-sm-4">
                <img src="http://picsum.photos/id/20/400/300" alt="具有圓角效果的圖片" class="rounded">
            </div>
            <div class="col-sm-4">
                <img src="http://picsum.photos/id/20/400/300" alt="呈現圓形效果的圖片" class="rounded-circle">
            </div>
            <div class="col-sm-4">
                <img src="http://picsum.photos/id/20/400/300" alt="帶縮圖邊框效果的圖片" class="img-thumbnail">
            </div>
        </div>
        <div class="row g-4">
            <img src="http://picsum.photos/id/20/400/300" alt="" class="img-fluid">
            <p class="lead text-muted">img-fluid 可以讓圖片隨螢幕滿版縮放。</p>
        </div>
    </div>
</body>

</html>
