<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <title>Bootstrap 5 基礎範例</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
  <div class="container py-5">
    <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

    <div class="text-center mb-5">
      <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 基礎範例</p>
      <h1 class="display-5 fw-bold">基礎版型與內容區塊</h1>
      <p class="lead text-muted">透過欄位系統與卡片式排版，建立一個乾淨、清楚且有層次的內容展示頁。</p>
    </div>

    <div class="row g-4">
      <div class="col-sm-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-body">
            <h3 class="card-title h5">欄位一</h3>
            <p class="card-text">這個區塊用來放置最重要的內容，讓讀者一眼就知道重點。</p>
            <p class="card-text">搭配 Bootstrap 的卡片樣式，能讓版面看起來更整齊且有層次。</p>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-body">
            <h3 class="card-title h5">欄位二</h3>
            <p class="card-text">這裡可以放置說明文字、產品特色或功能介紹。</p>
            <p class="card-text">利用欄寬與間距，讓不同內容彼此分開又保持整體協調。</p>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-body">
            <h3 class="card-title h5">欄位三</h3>
            <p class="card-text">這個欄位適合放置補充資訊或次要內容。</p>
            <p class="card-text">整體上保持一致的字體與層級，讓整個頁面更有統一感。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
