<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 輪播範例</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <a href="./index.html" class="btn btn-outline-secondary mb-4">← 返回前頁</a>

        <div class="text-center mb-4">
            <p class="text-uppercase text-primary fw-bold mb-2">Bootstrap 輪播範例</p>
            <h1 class="display-6 fw-bold">圖片輪播與視覺焦點</h1>
            <p class="lead text-muted">把多張圖片搭配簡潔說明，讓畫面更有層次與節奏。</p>
        </div>

        <nav class="navbar navbar-expand-sm navbar-dark bg-primary rounded-pill px-3 mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">輪播展示</a>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">返回前頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link 1</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="card shadow-sm border-0 p-3">
            <div id="demo" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
                </div>

                <div class="carousel-inner rounded-3 overflow-hidden">
                    <div class="carousel-item active">
                        <img src="http://picsum.photos/1200/360" alt="Carousel 1" class="d-block w-100">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>第一張展示圖</h5>
                            <p>適合放置專案主題或封面圖片。</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="http://picsum.photos/1200/360?grayscale" alt="Carousel 2" class="d-block w-100">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>第二張展示圖</h5>
                            <p>可以呈現不同的內容區塊。</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="http://picsum.photos/1200/360/?blur" alt="Carousel 3" class="d-block w-100">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>第三張展示圖</h5>
                            <p>搭配簡潔文字讓畫面更有重點。</p>
                        </div>
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
