<style>
    form {
        margin: auto;
        text-align: center;
    }
    
    table {
        margin: auto;
        border-collapse: collapse;
        background-color: #FFFF99;
    }

    table tr>td {
        width: 400px;
        height: 100px;
        text-align: center;
        vertical-align: middle;
        border: 1px solid black;
    }

    table img {
        width: auto;
        height: 150px;
    }

    input {
        margin: 10px 5px;
    }
</style>
<form action="">
    <table>
        <tr>
            <td>真皮皮包</td>
            <td>真皮短夾</td>
        </tr>
        <tr>
            <td>
                <img src="../images/0403.jpg" alt="">
            </td>
            <td>
                <img src="../images/0404.jpg" alt="">
            </td>
        </tr>
        <tr style="height: 150px;">
            <td>
                <input type="radio" name="bag" id="bag1" value="購買"><label for="bag1">購買</label>
                <input type="radio" name="bag" id="bag2" value="不購買"><label for="bag2">不購買</label>
                <input type="radio" name="bag" id="bag3" value="考慮中"><label for="bag3">考慮中</label>
            </td>
            <td>
                <input type="radio" name="wallet" id="wallet1" value="購買"><label for="wallet1">購買</label>
                <input type="radio" name="wallet" id="wallet2" value="不購買"><label for="wallet2">不購買</label>
                <input type="radio" name="wallet" id="wallet3" value="考慮中"><label for="wallet3">考慮中</label>
            </td>
        </tr>
    </table>
    <input type="submit" value="送出" onclick="send()">
    <input type="reset" value="重置">
</form>

<script>
    function send(){
        let bag = document.querySelector('input[name="bag"]:checked').value;
        let wallet = document.querySelector('input[name="wallet"]:checked').value;
        let message = `
            流行皮件選購確認：

            真皮皮包：${bag}
            真皮短夾：${wallet}
        `;
        alert(message);
    }
</script>
