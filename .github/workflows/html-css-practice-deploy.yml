name: 🚀 自動外送 html-css-practice 到 html-css-practice

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 html-css-practice專屬主機同步
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 步驟1：取得最新程式碼
      uses: actions/checkout@v4

    - name: 🏗️ 步驟2：動態配置專案資料夾結構
      run: |
        rm -rf deploy_temp
        mkdir -p deploy_temp/htdocs/front-end-learning/html-css-practice/
        rsync -av --exclude='deploy_temp' --exclude='.git' --exclude='.github' ./html-css-practice/ deploy_temp/htdocs/front-end-learning/html-css-practice/

    - name: 📂 步驟3：透過 FTP 安全同步到主機
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy_temp/htdocs/front-end-learning/html-css-practice/
        server-dir: ./htdocs/front-end-learning/html-css-practice/